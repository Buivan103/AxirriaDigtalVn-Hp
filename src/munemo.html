<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{head}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="{{base}}style.css">
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="{{homeHref}}" aria-label="Axirria Digital Vietnam"><img class="mark" src="{{base}}logo-mark.svg" width="44" height="44" alt=""><span class="nm"><span class="wm" aria-hidden="true">ax<i>ı<b class="h"></b></i>rr<i>ı<b class="f"></b></i>a</span><span class="r">digital vietnam</span></span></a>
    <nav class="lang" aria-label="Language">{{langSwitch}}</nav>
  </div>
</header>

<main>
  <section id="munemo" class="block">
    <div class="wrap">
      <div class="mu">
        <div>
          <h1 class="page-title" data-i18n="mu.title"></h1>
          <p class="sub" data-i18n="mu.lead"></p>
          <p class="mu-by" data-i18n="mu.by"></p>
          <ul data-i18n="mu.l"></ul>
          <div class="mu-cta">
            <a class="btn" href="{{homeHref}}#contact" data-i18n="mu.cta"></a>
            <a class="btn btn-line" href="{{cfg.munemoUrl}}" target="_blank" rel="noopener" data-i18n="mu.more"></a>
          </div>
        </div>
        <div class="chat">
          <div class="chat-head"><span class="av ai">M</span><strong>Munemo<small data-i18n="mu.hint"></small></strong></div>
          <div class="chat-body" aria-live="polite">
            <div class="msg" id="chatEmpty"><span class="av ai">M</span><div class="bubble" data-i18n="mu.empty"></div></div>
            <div class="msg me in" id="askMsg" hidden><div class="bubble long"><div class="clamp" data-i18n="mu.text"></div><small data-i18n="mu.len"></small></div></div>
            <div class="msg in" id="thinkMsg" hidden><span class="av ai">M</span><div class="thinking" data-i18n="mu.thinking"></div></div>
            <div class="msg in" id="sumMsg" hidden><span class="av ai">M</span>
              <div class="sumwrap">
                <div class="sumcard" data-i18n="mu.sum"></div>
                <div class="acts-row">
                  <button class="act" type="button" data-i18n="mu.slack" data-done="mu.slackDone"></button>
                  <button class="act" type="button" data-i18n="mu.jira" data-done="mu.jiraDone"></button>
                  <button class="act" type="button" data-i18n="mu.mail" data-done="mu.mailDone"></button>
                </div>
                <p class="demo-note" data-i18n="mu.note"></p>
              </div>
            </div>
          </div>
          <div class="chat-input" id="chatInput">
            <textarea class="field" id="muInput" rows="8" readonly data-i18n="mu.text" data-i18n-label="mu.inputLabel"></textarea>
            <div class="try">
              <p data-i18n="mu.tryHint"></p>
              <button class="btn try-btn" type="button" id="sumBtn" data-i18n="mu.run"></button>
            </div>
          </div>
        </div>
      </div>
      <p class="back"><a class="textlink" href="{{productsHref}}" data-i18n="pr.all"></a></p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span class="ft-logo" aria-label="Axirria Digital Vietnam"><img class="mark" src="{{base}}logo-mark.svg" width="44" height="44" alt=""><span class="nm"><span class="wm" aria-hidden="true">ax<i>ı<b class="h"></b></i>rr<i>ı<b class="f"></b></i>a</span><span class="r">digital vietnam</span></span></span>
    <span>© 2026 AXIRRIA DIGITAL VIETNAM LIMITED COMPANY</span>
  </div>
</footer>

<script src="{{base}}i18n.js"></script>
<script src="{{base}}main.js"></script>
</body>
</html>
