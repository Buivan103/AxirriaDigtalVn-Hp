<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axirria Digital Vietnam</title>
<meta name="description" content="Axirria Digital Vietnam: AI products, AI adoption and offshore development estimated by the hour.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
:root{
  --yellow:#FFD21F; --yellow-soft:#FFF3BF;
  --indigo:#1E2A5A; --indigo-2:#55608F; --paper:#F5F6FA; --line:#DCDFEA; --white:#fff;
  --display:"Bricolage Grotesque","BIZ UDPGothic",sans-serif;
  --body:"BIZ UDPGothic","Bricolage Grotesque",sans-serif;
  --max:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html:lang(ja){line-break:strict}
html:lang(ja) :is(h1,h2,h3,p,li,dd,td,th,blockquote,.bubble){word-break:auto-phrase}
h1,h2,h3,blockquote{text-wrap:balance}
p,li,dd{text-wrap:pretty;overflow-wrap:break-word}
body{font-family:var(--body);color:var(--indigo);background:var(--white);font-size:1rem;line-height:1.8}
a{color:inherit}
:focus-visible{outline:3px solid var(--indigo);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--display);line-height:1.25;font-weight:700}
h2{font-size:clamp(1.6rem,3vw,2.25rem);max-width:22em}
.sub{color:var(--indigo-2);max-width:38em;margin-top:12px}
.block{padding:112px 0}
.tint{background:var(--paper)}

.btn{display:inline-block;background:var(--indigo);color:var(--white);font:inherit;font-weight:700;text-decoration:none;padding:14px 24px;border:0;border-radius:6px;cursor:pointer}
.btn:hover{background:#2C3B78}
.textlink{font-weight:700;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}

/* header */
header{background:var(--yellow)}
.nav{display:flex;align-items:center;gap:32px;height:76px}
.logo{font-family:var(--display);font-weight:800;font-size:1.2rem;text-decoration:none;margin-right:auto;letter-spacing:-.01em}
.logo span{font-weight:500}
.menu{display:flex;gap:28px;list-style:none;font-size:.92rem}
.menu a{text-decoration:none}
.menu a:hover{text-decoration:underline;text-underline-offset:5px}
.lang{display:flex;background:rgba(30,42,90,.1);border-radius:6px;padding:3px}
.lang button{border:0;background:none;font:inherit;font-size:.82rem;font-weight:700;padding:4px 10px;border-radius:4px;cursor:pointer;color:var(--indigo-2)}
.lang button[aria-pressed=true]{background:var(--white);color:var(--indigo)}
@media (max-width:900px){.menu{display:none}}
.logo,.lang button{white-space:nowrap}
@media (max-width:420px){.logo{font-size:1rem}.nav{gap:12px}}

/* hero: the estimate sheet is the one memorable element */
.hero{background:var(--yellow);padding:56px 0 96px}
.hero .wrap{display:grid;grid-template-columns:1fr 1.05fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(2.4rem,5.4vw,4.3rem);font-weight:800;letter-spacing:-.02em}
h1 span,h2 span{display:inline-block}
.hero p{margin-top:24px;max-width:30em}
.hero .cta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-top:36px}

.sheet{background:var(--white);border-radius:10px;padding:28px;box-shadow:0 1px 0 rgba(30,42,90,.15),0 24px 48px -24px rgba(30,42,90,.35)}
.sheet h2{font-size:1.05rem;font-family:var(--body)}
.sheet h2 small{display:block;font-weight:400;color:var(--indigo-2);font-size:.85rem}
.sheet table{width:100%;border-collapse:collapse;margin-top:18px;font-size:.9rem}
.sheet th{font-weight:400;color:var(--indigo-2);text-align:left;font-size:.8rem;padding-bottom:8px}
.sheet td{padding:11px 0;border-top:1px solid var(--line);vertical-align:middle}
.sheet td.h{font-family:var(--display);font-weight:700;text-align:right;white-space:nowrap;padding-left:12px;font-size:1rem}
.sheet td.bar{width:42%;padding-left:16px}
.split{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--paper)}
.split i{display:block;height:100%}
.split .dev{background:var(--indigo)}
.split .ai{background:var(--yellow)}
.split .loop{background:repeating-linear-gradient(-45deg,var(--yellow) 0 6px,var(--yellow-soft) 6px 12px)}
.sheet td small{display:block;font-size:.75rem;color:var(--indigo-2)}
.sheet tfoot td{border-top:2px solid var(--indigo);font-weight:700}
.sheet tfoot td.h{font-size:1.5rem}
.key{display:flex;gap:18px;margin-top:16px;font-size:.8rem;color:var(--indigo-2);flex-wrap:wrap}
.key span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--indigo)}
.key span.ai::before{background:var(--yellow)}
.key b{margin-left:auto;color:var(--indigo)}
@media (prefers-reduced-motion:no-preference){
  .split i{transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
  tbody tr:nth-child(2) .split i{animation-delay:.12s}
  tbody tr:nth-child(3) .split i{animation-delay:.24s}
  tbody tr:nth-child(4) .split i{animation-delay:.36s}
  @keyframes grow{from{transform:scaleX(0)}}
}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr;gap:40px}.hero{padding-top:32px}}
@media (max-width:600px){.sheet{padding:22px 18px}.sheet td.bar{width:28%;padding-left:10px}.sheet td{font-size:.86rem}}

/* services as rows, not cards */
.rows{margin-top:56px;border-top:2px solid var(--indigo)}
.rows article{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:32px;padding:32px 0;border-bottom:1px solid var(--line)}
.rows h3{font-size:1.35rem}
.rows p{color:var(--indigo-2)}
.rows ul{list-style:none;font-size:.92rem}
.rows li{padding-left:16px;position:relative}
.rows li::before{content:"";position:absolute;left:0;top:.8em;width:6px;height:6px;background:var(--yellow);border:1px solid var(--indigo);border-radius:50%}
@media (max-width:800px){.rows article{grid-template-columns:1fr;gap:10px}}

/* munemo */
.mu{display:grid;grid-template-columns:.9fr 1.1fr;gap:64px;align-items:start;margin-top:48px}
.mu ul{list-style:none;margin:0 0 32px}
.mu li{padding:10px 0;border-bottom:1px solid var(--line)}
/* Munemo chat demo (bubble/avatar pattern from the CDP AI chat) */
.chat{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 16px 40px -24px rgba(30,42,90,.35)}
.chat-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.chat-head strong{font-size:.95rem;line-height:1.3}
.chat-head small{display:block;font-size:.78rem;color:var(--indigo-2);font-weight:400}
.chat-body{background:var(--paper);padding:20px 18px;display:grid;gap:14px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg > div{min-width:0}
.av{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:#E3E6F1;color:var(--indigo);user-select:none}
.av.ai{background:var(--yellow)}
.msg small{display:block;font-size:.75rem;color:var(--indigo-2);margin:0 0 3px 2px}
.bubble{background:var(--white);border:1px solid var(--line);border-radius:0 14px 14px 14px;padding:10px 14px;font-size:.9rem;line-height:1.7}
.msg.me{flex-direction:row-reverse}
.msg.me .bubble{background:var(--indigo);color:var(--white);border-color:var(--indigo);border-radius:14px 0 14px 14px}
.thinking{font-size:.88rem;font-weight:700;padding-top:6px;background:linear-gradient(100deg,#9AA1BF 35%,var(--indigo) 50%,#9AA1BF 65%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2s linear infinite}
@keyframes shimmer{from{background-position:200% center}to{background-position:-200% center}}
.sumcard{background:var(--white);border:1px solid var(--line);border-radius:0 14px 14px 14px;overflow:hidden;flex:1}
.sumcard h3{font-family:var(--body);font-size:.85rem;padding:9px 14px;background:var(--yellow-soft);border-bottom:1px solid var(--line)}
.sumcard dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;padding:12px 14px;font-size:.9rem;line-height:1.6}
.sumcard dt{color:var(--indigo-2);font-size:.82rem;padding-top:2px}
.chat-input{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.chat-input .field{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:.9rem;color:var(--indigo-2);line-height:1.5}
.chat-input .btn{padding:10px 18px;font-size:.9rem;border-radius:10px}
.chat-input .btn:disabled{background:#C9CDDD;cursor:default}
@media (prefers-reduced-motion:no-preference){.chat-body > .in{animation:rise .3s ease-out}@keyframes rise{from{opacity:0;transform:translateY(6px)}}}
@media (prefers-reduced-motion:reduce){.thinking{animation:none;color:var(--indigo-2)}}
@media (max-width:900px){.mu{grid-template-columns:1fr;gap:40px}}

/* offshore */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:48px}
.role{border-radius:10px;padding:28px}
.role.dev{background:var(--indigo);color:var(--white)}
.role.ai{background:var(--yellow)}
.role h3{font-size:1.25rem;display:flex;align-items:baseline;gap:12px}
.role h3 span{font-size:2.6rem;font-weight:800;line-height:1}
.role ul{list-style:none;margin-top:14px}
.role li{padding:6px 0;border-top:1px solid rgba(255,255,255,.2)}
.role.ai li{border-top-color:rgba(30,42,90,.2)}
@media (max-width:700px){.roles{grid-template-columns:1fr}}
.tbl{overflow-x:auto;margin-top:56px}
table.cmp{width:100%;border-collapse:collapse}
.nb{display:inline-block}
dl.info small{color:var(--indigo-2);font-size:.88rem}
.cmp th,.cmp td{text-align:left;padding:14px 16px 14px 0;border-bottom:1px solid var(--line)}
.cmp thead th{font-size:.85rem;color:var(--indigo-2);font-weight:400;border-bottom:2px solid var(--indigo)}
.cmp thead th:last-child{color:var(--indigo);font-weight:700}
.cmp tbody th{width:22%}
@media (max-width:600px){.cmp{font-size:.88rem}.cmp th,.cmp td{padding-right:10px}.cmp td:last-child{padding-left:8px}}
.cmp td:last-child{font-weight:700;background:linear-gradient(var(--yellow-soft),var(--yellow-soft)) no-repeat left/calc(100% - 8px) 100%;padding-left:12px}
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:64px;counter-reset:s}
.steps li{counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--yellow);font-family:var(--display);font-weight:800;margin-bottom:14px}
.steps h3{font-size:1.1rem;margin-bottom:4px}
.steps p{color:var(--indigo-2);font-size:.92rem}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}

/* partner */
.partner .wrap{display:grid;grid-template-columns:1fr 1fr;gap:64px}
.partner blockquote{font-family:var(--display);font-size:clamp(1.3rem,2.4vw,1.8rem);font-weight:500;line-height:1.5;margin:20px 0 28px}
.partner dl{border-top:2px solid var(--indigo)}
.partner dt{font-weight:700;padding-top:18px}
.partner dd{color:var(--indigo-2);padding-bottom:18px;border-bottom:1px solid var(--line)}
@media (max-width:900px){.partner .wrap{grid-template-columns:1fr;gap:32px}}

/* company */
dl.info{display:grid;grid-template-columns:200px 1fr;margin-top:40px;border-top:2px solid var(--indigo)}
dl.info dt,dl.info dd{padding:16px 0;border-bottom:1px solid var(--line)}
dl.info dt{color:var(--indigo-2)}
@media (max-width:600px){dl.info{grid-template-columns:1fr}dl.info dt{border:0;padding-bottom:0}}

/* contact */
.contact{display:grid;grid-template-columns:1fr 1.3fr;gap:56px;margin-top:48px;align-items:start}
.ways{display:grid;gap:12px}
.ways a,.ways div{display:block;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:18px 20px;text-decoration:none}
.ways a:hover{border-color:var(--indigo)}
.ways small{display:block;color:var(--indigo-2);font-size:.82rem}
.ways strong{font-size:1.05rem}
form{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:32px;display:grid;gap:18px}
label{display:grid;gap:6px;font-size:.88rem;font-weight:700}
input,select,textarea{font:inherit;font-weight:400;color:var(--indigo);padding:11px 12px;border:1px solid #BFC4D8;border-radius:6px;background:var(--white);width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:0;border-color:var(--indigo)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
form .btn{justify-self:start}
#formMsg{font-size:.92rem}
@media (max-width:900px){.contact{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}

footer{background:var(--indigo);color:#C9CEE3;padding:28px 0;font-size:.85rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="#top">Axirria <span>Digital Vietnam</span></a>
    <ul class="menu">
      <li><a href="#services" data-i18n="nav.services"></a></li>
      <li><a href="#munemo" data-i18n="nav.munemo"></a></li>
      <li><a href="#offshore" data-i18n="nav.offshore"></a></li>
      <li><a href="#company" data-i18n="nav.company"></a></li>
      <li><a href="#contact" data-i18n="nav.contact"></a></li>
    </ul>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ja">日本語</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div>
        <h1 data-i18n="hero.title"></h1>
        <p data-i18n="hero.lead"></p>
        <div class="cta">
          <a class="btn" href="#contact" data-i18n="hero.cta1"></a>
          <a class="textlink" href="#offshore" data-i18n="hero.cta2"></a>
        </div>
      </div>
      <div class="sheet" role="figure" aria-labelledby="sheetTitle">
        <h2 id="sheetTitle"><span data-i18n="est.title"></span><small data-i18n="est.team"></small></h2>
        <table>
          <thead><tr><th data-i18n="est.task"></th><th data-i18n="est.split"></th><th style="text-align:right" data-i18n="est.hours"></th></tr></thead>
          <tbody>
            <tr><td data-i18n="est.r1"></td><td class="bar"><div class="split"><i class="dev" style="width:20%"></i><i class="ai" style="width:60%"></i></div></td><td class="h">4.0h</td></tr>
            <tr><td data-i18n="est.r2"></td><td class="bar"><div class="split"><i class="dev" style="width:10%"></i><i class="ai" style="width:50%"></i></div></td><td class="h">3.0h</td></tr>
            <tr><td data-i18n="est.r3"></td><td class="bar"><div class="split"><i class="dev" style="width:30%"></i><i class="ai" style="width:70%"></i></div></td><td class="h">5.0h</td></tr>
            <tr><td data-i18n="est.r4"></td><td class="bar"><div class="split"><i class="ai loop" style="width:100%"></i></div></td><td class="h" data-i18n="est.par"></td></tr>
          </tbody>
          <tfoot><tr><td colspan="2" data-i18n="est.total"></td><td class="h">12h</td></tr></tfoot>
        </table>
        <div class="key"><span data-i18n="est.dev"></span><span class="ai" data-i18n="est.ai"></span><b data-i18n="est.demo"></b></div>
      </div>
    </div>
  </section>

  <section id="services" class="block">
    <div class="wrap">
      <h2 data-i18n="svc.title"></h2>
      <p class="sub" data-i18n="svc.lead"></p>
      <div class="rows">
        <article><h3 data-i18n="svc1.t"></h3><p data-i18n="svc1.d"></p><ul data-i18n="svc1.l"></ul></article>
        <article><h3 data-i18n="svc2.t"></h3><p data-i18n="svc2.d"></p><ul data-i18n="svc2.l"></ul></article>
        <article><h3 data-i18n="svc3.t"></h3><p data-i18n="svc3.d"></p><ul data-i18n="svc3.l"></ul></article>
      </div>
    </div>
  </section>

  <section id="munemo" class="block tint">
    <div class="wrap">
      <h2 data-i18n="mu.title"></h2>
      <p class="sub" data-i18n="mu.lead"></p>
      <div class="mu">
        <div>
          <ul data-i18n="mu.l"></ul>
          <a class="btn" href="#contact" data-i18n="mu.cta"></a>
        </div>
        <div class="chat">
          <div class="chat-head"><span class="av ai">M</span><strong>Munemo<small data-i18n="mu.hint"></small></strong></div>
          <div class="chat-body" aria-live="polite">
            <div data-i18n="mu.log" style="display:grid;gap:14px"></div>
            <div class="msg me in" id="askMsg" hidden><div class="bubble" data-i18n="mu.ask"></div></div>
            <div class="msg in" id="thinkMsg" hidden><span class="av ai">M</span><div class="thinking" data-i18n="mu.thinking"></div></div>
            <div class="msg in" id="sumMsg" hidden><span class="av ai">M</span><div class="sumcard" data-i18n="mu.sum"></div></div>
          </div>
          <div class="chat-input">
            <div class="field" data-i18n="mu.ask"></div>
            <button class="btn" type="button" id="sumBtn" data-i18n="mu.run"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="offshore" class="block">
    <div class="wrap">
      <h2 data-i18n="off.title"></h2>
      <p class="sub" data-i18n="off.lead"></p>
      <div class="roles">
        <div class="role dev"><h3><span>0.5</span><em style="font-style:normal" data-i18n="off.dev"></em></h3><ul data-i18n="off.devl"></ul></div>
        <div class="role ai"><h3><span>1</span><em style="font-style:normal" data-i18n="off.agent"></em></h3><ul data-i18n="off.agentl"></ul></div>
      </div>
      <div class="tbl">
        <table class="cmp">
          <thead><tr><th></th><th data-i18n="cmp.old"></th><th data-i18n="cmp.new"></th></tr></thead>
          <tbody data-i18n="cmp.rows"></tbody>
        </table>
      </div>
      <ol class="steps">
        <li><h3 data-i18n="step1.t"></h3><p data-i18n="step1.d"></p></li>
        <li><h3 data-i18n="step2.t"></h3><p data-i18n="step2.d"></p></li>
        <li><h3 data-i18n="step3.t"></h3><p data-i18n="step3.d"></p></li>
        <li><h3 data-i18n="step4.t"></h3><p data-i18n="step4.d"></p></li>
      </ol>
    </div>
  </section>

  <section class="block tint partner">
    <div class="wrap">
      <div>
        <h2 data-i18n="pt.title"></h2>
        <blockquote data-i18n="pt.quote"></blockquote>
        <p class="sub" data-i18n="pt.lead"></p>
        <p style="margin-top:24px"><a class="textlink" href="https://www.axirria.co.jp/" target="_blank" rel="noopener" data-i18n="pt.link"></a></p>
      </div>
      <dl>
        <dt data-i18n="pt1.t"></dt><dd data-i18n="pt1.d"></dd>
        <dt data-i18n="pt2.t"></dt><dd data-i18n="pt2.d"></dd>
        <dt data-i18n="pt3.t"></dt><dd data-i18n="pt3.d"></dd>
      </dl>
    </div>
  </section>

  <section id="company" class="block">
    <div class="wrap">
      <h2 data-i18n="co.title"></h2>
      <dl class="info" data-i18n="co.info"></dl>
    </div>
  </section>

  <section id="contact" class="block tint">
    <div class="wrap">
      <h2 data-i18n="ct.title"></h2>
      <p class="sub" data-i18n="ct.lead"></p>
      <div class="contact">
        <div class="ways">
          <a href="mailto:contact@axirria-digital.vn"><small data-i18n="ct.mail"></small><strong>contact@axirria-digital.vn</strong></a>
          <a href="https://zalo.me/0900000000" target="_blank" rel="noopener"><small>Zalo</small><strong>+84 900 000 000</strong></a>
        </div>
        <form id="contactForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
          <div class="row2">
            <label><span data-i18n="f.name"></span><input name="name" required autocomplete="name"></label>
            <label><span data-i18n="f.company"></span><input name="company" autocomplete="organization"></label>
          </div>
          <label><span data-i18n="f.email"></span><input type="email" name="email" required autocomplete="email"></label>
          <label><span data-i18n="f.topic"></span><select name="topic" data-i18n="f.topics"></select></label>
          <label><span data-i18n="f.msg"></span><textarea name="message" rows="4" required></textarea></label>
          <button class="btn" type="submit" data-i18n="f.send"></button>
          <p id="formMsg" role="status"></p>
        </form>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 AXIRRIA DIGITAL VIETNAM COMPANY LIMITED</span>

</footer>

<script src="i18n.js"></script>
<script>
(function () {
  var buttons = document.querySelectorAll('[data-lang]');
  function setLang(lang) {
    if (!I18N[lang]) lang = 'ja';
    var dict = I18N[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var v = dict[el.dataset.i18n];
      if (v != null) el.innerHTML = v;
    });
    buttons.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.lang === lang); });
    try { localStorage.setItem('lang', lang); } catch (e) {}
  }
  buttons.forEach(function (b) { b.addEventListener('click', function () { setLang(b.dataset.lang); }); });

  var saved = new URLSearchParams(location.search).get('lang');
  try { saved = saved || localStorage.getItem('lang'); } catch (e) {}
  setLang(saved || (/^ja/.test(navigator.language) ? 'ja' : 'en'));

  var sumBtn = document.getElementById('sumBtn');
  sumBtn.addEventListener('click', function () {
    var think = document.getElementById('thinkMsg');
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    sumBtn.disabled = true;
    document.getElementById('askMsg').hidden = false;
    think.hidden = false;
    setTimeout(function () {
      think.hidden = true;
      document.getElementById('sumMsg').hidden = false;
    }, reduce ? 0 : 1200);
  });

  var form = document.getElementById('contactForm'), msg = document.getElementById('formMsg');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var dict = I18N[document.documentElement.lang];
    msg.textContent = dict['f.sending'];
    fetch(form.action, { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' } })
      .then(function (r) { if (!r.ok) throw 0; form.reset(); msg.textContent = dict['f.ok']; })
      .catch(function () { msg.textContent = dict['f.err']; });
  });
})();
</script>
</body>
</html>
